<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merchant Terrain Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/main.css" />
</head>
<body>

<!-- ── Auth modal ───────────────────────────────────────────────────────── -->
<div id="auth-overlay" class="hidden">
  <div id="auth-modal">
    <button id="modal-close">✕</button>
    <div class="header-ornament">⸻</div>
    <h1 id="auth-logo">Merchant<br/>Terrain</h1>
    <div class="header-ornament">⸻</div>

    <div id="auth-tabs">
      <span class="auth-tab active" data-tab="login">Login</span>
      <span class="auth-tab-sep">·</span>
      <span class="auth-tab" data-tab="register">Register</span>
    </div>

    <form id="login-form" class="auth-form">
      <input class="auth-input" type="email"    name="email"    placeholder="Email"    required />
      <input class="auth-input" type="password" name="password" placeholder="Password" required />
      <button class="auth-submit" type="submit">Enter the Realm</button>
    </form>

    <form id="register-form" class="auth-form" style="display:none">
      <input class="auth-input" type="text"     name="username" placeholder="Username" required />
      <input class="auth-input" type="email"    name="email"    placeholder="Email"    required />
      <input class="auth-input" type="password" name="password" placeholder="Password" required />
      <button class="auth-submit" type="submit">Create Account</button>
    </form>

    <p id="auth-error"></p>
  </div>
</div>

<!-- ── Resource lookup modal ────────────────────────────────────────────── -->
<div id="resource-overlay" class="hidden">
  <div id="resource-modal">
    <button id="resource-close">✕</button>
    <div class="header-ornament">⸻</div>
    <h2 class="res-modal-title">Resource Lookup</h2>
    <div class="header-ornament">⸻</div>

    <div class="res-filters">
      <div class="res-filter-row">
        <label class="res-filter-label">Type</label>
        <select id="res-type" class="auth-input res-select">
          <option value="">All Types</option>
          <option value="Ore">⛏ Ore</option>
          <option value="Stone">🪨 Stone</option>
          <option value="Wood">🌲 Wood</option>
          <option value="Raw Food">🌾 Raw Food</option>
        </select>
      </div>
      <div class="res-filter-row">
        <label class="res-filter-label">Resource</label>
        <select id="res-name" class="auth-input res-select"></select>
      </div>
      <div class="res-filter-row">
        <label class="res-filter-label">Min ★</label>
        <div class="res-stars-picker">
          <span class="res-star-opt active" data-val="0">Any</span>
          <span class="res-star-opt" data-val="1">★</span>
          <span class="res-star-opt" data-val="2">★★</span>
          <span class="res-star-opt" data-val="3">★★★</span>
          <span class="res-star-opt" data-val="4">★★★★</span>
          <span class="res-star-opt" data-val="5">★★★★★</span>
        </div>
      </div>
    </div>

    <div id="resource-results"></div>
  </div>
</div>

<!-- ── App ──────────────────────────────────────────────────────────────── -->
<aside id="sidebar">
  <div id="sidebar-header">
    <div class="header-ornament">⸻</div>
    <h1>Merchant<br/>Terrain</h1>
    <div class="header-ornament">⸻</div>
    <div id="user-bar">
      <span id="login-btn">⚔ Login</span>
      <span id="username-display" style="display:none"></span>
      <span id="logout-btn" style="display:none">↩ Logout</span>
    </div>
    <select id="country-select"></select>
    <select id="state-select" style="display:none">
      <option value="">— Select a state —</option>
    </select>
  </div>

  <section class="panel">
    <h2 class="panel-title">Paint</h2>
    <div id="terrain-list"></div>
    <div class="divider"></div>
    <div id="eraser-btn" class="action-btn">⬜ Eraser</div>
  </section>

  <section class="panel">
    <h2 class="panel-title">Filters</h2>
    <div class="filter-actions">
      <button class="filter-quick" id="filter-all">All</button>
      <button class="filter-quick" id="filter-none">None</button>
    </div>
    <div id="filter-list"></div>
  </section>

  <section class="panel">
    <h2 class="panel-title">Data</h2>
    <div id="export-btn" class="action-btn secondary-btn">↓ Export JSON</div>
    <div id="import-btn" class="action-btn secondary-btn">↑ Import JSON</div>
    <input type="file" id="import-input" accept=".json" style="display:none" />
  </section>

  <section class="panel">
    <h2 class="panel-title">Resources</h2>
    <div id="resource-btn" class="action-btn secondary-btn">🔍 Resource Lookup</div>
  </section>

  <div id="reset-btn">✕ Reset Map</div>
</aside>

<div id="map"></div>

<script type="module" src="/main.js"></script>
</body>
</html>
