<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netherlands Terrain Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/main.css" />
</head>
<body>

<aside id="sidebar">
  <div id="sidebar-header">
    <div class="header-ornament">⸻</div>
    <h1>Terrain<br/>Atlas</h1>
    <div class="header-ornament">⸻</div>
    <select id="country-select"></select>
    <select id="state-select" style="display:none">
      <option value="">— Select a state —</option>
    </select>
  </div>

  <section class="panel">
    <h2 class="panel-title">Paint</h2>
    <div id="terrain-list"></div>
    <div class="divider"></div>
    <div id="eraser-btn" class="action-btn">⬜ Eraser</div>
  </section>

  <section class="panel">
    <h2 class="panel-title">Filters</h2>
    <div class="filter-actions">
      <button class="filter-quick" id="filter-all">All</button>
      <button class="filter-quick" id="filter-none">None</button>
    </div>
    <div id="filter-list"></div>
  </section>

  <section class="panel">
    <h2 class="panel-title">Data</h2>
    <div id="export-btn" class="action-btn secondary-btn">↓ Export JSON</div>
    <div id="import-btn" class="action-btn secondary-btn">↑ Import JSON</div>
    <input type="file" id="import-input" accept=".json" style="display:none" />
  </section>

  <div id="reset-btn">✕ Reset Map</div>
</aside>

<div id="map"></div>

<script type="module" src="/main.js"></script>
</body>
</html>
