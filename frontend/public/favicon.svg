<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="coin" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="55%" stop-color="#d4a030"/>
      <stop offset="100%" stop-color="#8a5c0e"/>
    </radialGradient>
    <radialGradient id="jewel-c" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffe090"/>
      <stop offset="100%" stop-color="#b07010"/>
    </radialGradient>
  </defs>

  <!-- Coin body -->
  <circle cx="16" cy="16" r="15.5" fill="url(#coin)"/>
  <!-- Coin edge -->
  <circle cx="16" cy="16" r="15.5" fill="none" stroke="#6a4206" stroke-width="1"/>
  <!-- Inner rim -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="rgba(255,230,90,0.35)" stroke-width="0.8"/>

  <!-- Crown body: 3 peaks -->
  <path d="M9 21 L9 15.5 L12 11.5 L14.5 14.5 L16 10.5 L17.5 14.5 L20 11.5 L23 15.5 L23 21 Z"
        fill="#2c1500"/>
  <!-- Crown base band -->
  <rect x="9" y="21" width="14" height="2.8" rx="0.8" fill="#2c1500"/>

  <!-- Crown jewels at each peak tip -->
  <circle cx="12" cy="11.5" r="1.5" fill="url(#jewel-c)" stroke="#6a4206" stroke-width="0.5"/>
  <circle cx="16" cy="10.5" r="1.8" fill="url(#jewel-c)" stroke="#6a4206" stroke-width="0.5"/>
  <circle cx="20" cy="11.5" r="1.5" fill="url(#jewel-c)" stroke="#6a4206" stroke-width="0.5"/>
</svg>
